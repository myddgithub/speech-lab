<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>音高编辑器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: var(--font, "Segoe UI", "Microsoft YaHei", sans-serif); }

    #toolbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 3px 8px 5px; font-size: 12px; user-select: none;
    }
    #title { font-weight: 600; font-size: 12px; opacity: 0.9; }
    .btn {
      border: 1px solid rgba(128,128,128,.45); background: var(--secondary-background-color, #f0f2f6);
      color: var(--text-color, #31333f); border-radius: 6px; padding: 1px 8px;
      font-size: 11px; cursor: pointer; font-family: inherit;
    }
    .btn:hover { border-color: var(--primary-color, #ff4b4b); color: var(--primary-color, #ff4b4b); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.active { border-color: var(--primary-color, #ff4b4b); color: var(--primary-color, #ff4b4b); }
    label.chk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; opacity: .9; }
    #sylLabel { font-size: 12px; opacity: .75; }
    #sylText {
      width: 110px; border: 1px solid rgba(128,128,128,.45); border-radius: 6px;
      background: var(--secondary-background-color, #f0f2f6); color: var(--text-color, #31333f);
      padding: 3px 8px; font-size: 12px; font-family: inherit;
    }
    #hint { opacity: .6; font-size: 12px; margin-left: auto; }

    #wrap { position: relative; }
    canvas { display: block; width: 100%; touch-action: none; }
    #cv { height: 360px; cursor: crosshair; }
    #cvDur { height: 44px; cursor: ns-resize; }
    #cvSyl { height: 48px; cursor: pointer; }

    #tooltip {
      position: absolute; pointer-events: none; z-index: 5;
      background: rgba(20,20,24,.9); color: #fff; border-radius: 5px;
      padding: 4px 8px; font-size: 12px; line-height: 1.45; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,.35); display: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="title">音高曲线</span>
    <button class="btn" id="btnPlayOrig" title="播放原始音频">▶ 播放原始</button>
    <button class="btn" id="btnPlay" title="播放编辑后的音频">▶ 播放编辑后</button>
    <button class="btn" id="btnPlaySel" title="播放选中段（编辑后音频）" disabled>▶ 播放选中·编辑后</button>
    <button class="btn" id="btnPlaySelO" title="播放选中段（解码后原始音频）" disabled>▶ 播放选中·原始</button>
    <label class="chk"><input type="checkbox" id="chkOrig" checked /> 显示原始</label>
    <button class="btn" id="btnAnnotate" title="在下方音节轨拖拽创建/调整音节，Delete 删除">📝 标注音节</button>
    <span id="sylLabel">标注:</span>
    <input id="sylText" type="text" placeholder="如 liu4（数字=声调）" spellcheck="false" />
    <button class="btn" id="btnFit" title="重置视图缩放">重置缩放</button>
    <span id="hint">拖拽调音高 · 双击或按 A 加点 · Delete 删点 · ↑↓ 半音微调 · 滚轮缩放时间 · Shift+滚轮前后平移 · Ctrl+滚轮调音高刻度 · 点选 PY 边界按 B：区间层加边界 / 点层加点 · 波形上拖拽可框选任意段播放</span>
  </div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <canvas id="cvDur"></canvas>
    <canvas id="cvSyl"></canvas>
    <div id="tooltip"></div>
  </div>
  <script src="component.js?v=20260903r7"></script>
</body>
</html>
